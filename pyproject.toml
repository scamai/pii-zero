[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "pii-redact"
version = "0.1.0"
description = "PII Zero: local PII redaction for PDFs and document images"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
    # PDF
    "pymupdf>=1.23",
    # OCR
    "surya-ocr>=0.17",
    # NER
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "scispacy>=0.5",
    "gliner>=0.2",
    # Handwriting OCR
    "transformers>=4.38",
    "torch>=2.1",
    "torchvision>=0.16",
    # Visual detection
    "ultralytics>=8.1",
    "segment-anything",
    # Barcodes / QR
    "pyzbar>=0.1.9",
    "zxing-cpp>=2.2",
    # Metadata
    "piexif>=1.1",
    # Image processing
    "opencv-python-headless>=4.9",
    "Pillow>=10.2",
    # Crypto
    "cryptography>=42.0",
    # Config
    "pyyaml>=6.0",
    "click>=8.1",
    # UI
    "gradio>=4.19",
    # Hashing for template matching
    "imagehash>=4.3",
    # Layout-aware PDF parsing (field context for ORG disambiguation)
    "docling>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "datasets>=2.0",
]

[project.scripts]
pii-redact = "pii_redact.cli:main"

[project.urls]
Repository = "https://github.com/scamai/pii-zero"
Documentation = "https://github.com/scamai/pii-zero/blob/main/README.md"
Issues = "https://github.com/scamai/pii-zero/issues"
License = "https://github.com/scamai/pii-zero/blob/main/LICENSE"

[tool.ruff]
line-length = 100
