# Asks each pull request author to sign CLA.md once, and records signatures in
# signatures/version1/cla.json on the cla-signatures branch. That branch must
# stay unprotected: the workflow commits to it with GITHUB_TOKEN.
#
# The action never checks out or runs pull request code, which is what makes
# pull_request_target safe here. Do not add a checkout step.
#
# Upstream (contributor-assistant/github-action) is archived, so the action is
# pinned to the v2.6.1 commit. If CLA.md changes materially, bump the
# signatures path to version2 so everyone signs the new text.
#
# The first run after the signatures file is missing creates it and reports a
# failure even when every committer is on the allowlist; push again or comment
# "recheck" to re-run.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
    steps:
      - name: Check CLA signatures
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/scamai/pii-zero/blob/main/CLA.md
          branch: cla-signatures
          # Scam AI staff, and bots that cannot sign.
          allowlist: shenxingy,BensonRen,dependabot[bot],github-actions[bot]
